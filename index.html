  <script>
    // ==========================================
    // 1. INICIALIZAR EL MAPA Y CAPA BASE
    // ==========================================
    var map = L.map("map", {

      zoomDelta: 0.5
    }).setView([-12.0464, -77.0428], 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> - RIS 1 ',
      detectRetina: true, 
      crossOrigin: true
    }).addTo(map);

    // ==========================================
    // 2. DEFINICIÓN DE ICONOS (Colegios, Iglesias, Mercados, Hospitales)
    // ==========================================
    var smallIcon = L.divIcon({

      iconSize: [18, 32], className: 'svg-icon', iconAnchor: [6, 20], popupAnchor: [0, -20]
    });

    var smallIcon3 = L.divIcon({
      html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 489.437"><path d="M266.132 425.011c-3.122 2.276-7.36 2.59-10.837.357-37.511-23.86-69.044-52.542-93.798-83.672-34.164-42.862-55.708-90.407-63.066-136.17-7.494-46.427-.492-91.074 22.613-127.381 9.098-14.361 20.738-27.429 34.922-38.715C188.57 13.428 225.811-.263 262.875.004c35.727.268 70.961 13.601 101.424 41.391 10.706 9.722 19.715 20.872 27.074 32.959 24.843 40.899 30.196 93.084 19.269 145.982-17.047 82.829-71.772 160.522-144.51 204.675zM266.003 74.554v18.452h21.888v21.48h-21.888v7.761l61.86 62.516-18.139 15.249-3.964-4.091v35.716h-38.116v-26.093h-24.028v26.1l-37.794-.007v-35.784l-3.962 4.159-18.145-15.249 60.811-61.457v-8.82h-20.838v-21.48h20.838V74.554h21.477zm-10.216 80.627c7.883 0 14.273 6.39 14.273 14.273s-6.39 14.273-14.273 14.273c-7.882 0-14.272-6.39-14.272-14.273s6.39-14.273 14.272-14.273zm.003-117.93c69.041 0 125.006 55.965 125.006 125.006S324.831 287.263 255.79 287.263s-125.006-55.965-125.006-125.006S186.749 37.251 255.79 37.251z" fill="#80118e"/></svg>`,
      iconSize: [32, 45], className: 'svg-icon', iconAnchor: [6, 20], popupAnchor: [0, -20]
    });

    var smallIcon4 = L.divIcon({
      html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 489.437"><path d="M266.132 425.01c-3.122 2.276-7.36 2.59-10.837.358-37.511-23.86-69.044-52.542-93.797-83.673-34.165-42.861-55.709-90.407-63.066-136.169-7.494-46.428-.493-91.074 22.612-127.381 9.098-14.361 20.738-27.429 34.923-38.715C188.57 13.428 225.811-.263 262.875.004c35.727.268 70.961 13.601 101.423 41.391 10.707 9.722 19.716 20.872 27.075 32.959 24.843 40.898 30.195 93.084 19.269 145.982-17.047 82.828-71.772 160.521-144.51 204.674zM109.524 317.184c6.788 0 12.291 5.503 12.291 12.291s-5.503 12.291-12.291 12.291H71.37L33.265 464.855H477.89l-41.374-123.089h-28.585c-6.788 0-12.291-5.503-12.291-12.291s5.503-12.291 12.291-12.291h46.17L512 489.437H0l53.325-172.253h56.199zm77.29-186.755h13.169l32.231-36.104c2.864-3.208 7.827-3.49 11.035-.627v.003c3.211 2.863 3.49 7.83.627 11.038l-22.928 25.69h70.268l-22.932-25.69c-2.866-3.208-2.584-8.175.624-11.038h.003c3.208-2.866 8.172-2.584 11.038.624l32.229 36.106 12.591-.002.17.004 11.825.001c2.649 0 4.818 2.166 4.818 4.815v13.584a4.83 4.83 0 01-4.818 4.817h-10.233l-5.264 66.371c-.143 1.824-1.515 3.34-3.345 3.34H193.657c-1.831 0-3.198-1.51-3.342-3.34l-5.269-66.371h-10.23a4.83 4.83 0 01-4.818-4.817v-13.584c0-2.65 2.168-4.815 4.818-4.815l11.827-.001.171-.004zm91.635 25.827h15.228v44.027l-15.228.002v-44.029zm-29.629 0h15.223v44.027l-15.223.002v-44.029zm-29.631 0h15.228v44.027l-15.228.002v-44.029zM255.79 37.251c69.041 0 125.006 55.965 125.006 125.006S324.831 287.263 255.79 287.263s-125.006-55.965-125.006-125.006S186.749 37.251 255.79 37.251z" fill="#013220"/></svg>`,
      iconSize: [32, 45], className: 'svg-icon', iconAnchor: [6, 14], popupAnchor: [0, -20]
    });

    // Nuevo Icono de Hospital
    var hospitalIcon = L.icon({
      iconUrl: 'iconos/hospital2.png',
      iconSize: [40, 40],
      iconAnchor: [20, 40],
      popupAnchor: [0, -40]
    });

    // ==========================================
    // 3. VARIABLES DE ESTADO, NOMBRES Y COLORES SINCRONIZADOS
    // ==========================================
    const risSelect = document.getElementById("ris-select");
    const eessSelect = document.getElementById("eess-select");
    const distritoSelect = document.getElementById("distrito-select");
    const schoolSearchInput = document.getElementById("school-search");
    const schoolSearchResults = document.getElementById("school-search-results");
    const clearFiltersBtn = document.getElementById("clear-filters");

    const eessMarkers = {};
    const risEessMap = {};
    const eessPolygons = {};
    const distritoPolygons = {};

    const schoolIndex = [];
    const schoolGroupedData = [];
    let schoolMarkers = [];
    let currentHighlightedPolygon = null;

    // Función para normalizar nombres entre el CSV nuevo y el GeoJSON de polígonos
    function normalizarClaveEess(nombre) {
      const limpio = (nombre || "").trim().toUpperCase();
      if (limpio === "C.S. MENTAL MIRONES BAJOS") return "C.S.M.C MENTAL MIRONES BAJOS";
      if (limpio === "C.S. MENTAL SAN MARCOS") return "C.S.M.C MENTAL SAN MARCOS";
      return limpio;
    }

    // DEFINICIÓN DE COLORES (Sincronizado con los 16 centros de la lista)
    const coloresPoligonos = {
      "C.S. MIRONES BAJO": "#BAFFC9",
      "P.S. PALERMO": "#BAC4FF",
      "C.S. UNIDAD VECINAL N° 3": "#E8BAFF",
      "P.S. SANTA ROSA": "#E6E6FA",
      "C.S. VILLA MARIA PERPETUO SOCORRO": "#FFC4E1",
      "P.S. RESCATE": "#FFDAB9",
      "C.S. MIRONES": "#FFFFBA",
      "C.S. CONDE DE LA VEGA BAJA": "#FFB3BA",
      "C.S. SAN SEBASTIAN": "#BAE1FF",
      "C.S. JUAN PEREZ CARRANZA": "#FFDFBA",
      "P.S. JARDIN ROSA DE SANTA MARIA": "#D4FFBA",
      "C.S.M.C MENTAL MIRONES BAJOS": "#B3E5FC",
      "C.S.M.C MENTAL SAN MARCOS": "#C8E6C9",
      "C.S. PATRUCO": "#FFE0B2",
      "C.E. ANTIRABICO ZOONOSIS": "#D1C4E9",
      "COMEDOR CENTRO DE ALIMENTACION Y NUTRICION N°1": "#FFF59D"
    };

    // DEFINICIÓN DE NÚMEROS (Del 1 al 16)
    const eessNumeros = {
      "C.S. MIRONES BAJO": 1,
      "P.S. PALERMO": 2,
      "C.S. UNIDAD VECINAL N° 3": 3,
      "P.S. SANTA ROSA": 4,
      "C.S. VILLA MARIA PERPETUO SOCORRO": 5,
      "P.S. RESCATE": 6,
      "C.S. MIRONES": 7,
      "C.S. CONDE DE LA VEGA BAJA": 8,
      "C.S. SAN SEBASTIAN": 9,
      "C.S. JUAN PEREZ CARRANZA": 10,
      "P.S. JARDIN ROSA DE SANTA MARIA": 11,
      "C.S.M.C MENTAL MIRONES BAJOS": 12,
      "C.S.M.C MENTAL SAN MARCOS": 13,
      "C.S. PATRUCO": 14,
      "C.E. ANTIRABICO ZOONOSIS": 15,
      "COMEDOR CENTRO DE ALIMENTACION Y NUTRICION N°1": 16
    };

    // NOMBRES PERSONALIZADOS PARA MOSTRAR EN LA LEYENDA Y FILTROS
    const nombresLeyenda = {
      "C.S.M.C MENTAL MIRONES BAJOS": "C.S.M.C Mirones Bajos",
      "C.S.M.C MENTAL SAN MARCOS": "C.S.M.C San Marcos"
    };

    // ==========================================
    // 4. CAPAS DE CLUSTERS Y HOSPITALES MANUALES
    // ==========================================
    function createClusterLayer(clusterClassName) {
      return L.markerClusterGroup({
        showCoverageOnHover: false, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 17, maxClusterRadius: 45,
        iconCreateFunction: function(cluster) {
          return L.divIcon({
            html: `<div><span>${cluster.getChildCount()}</span></div>`,
            className: `marker-cluster ${clusterClassName}`, iconSize: L.point(40, 40)
          });
        }
      });
    }

    var colegiosLayer = createClusterLayer('cluster-colegios');
    var iglesiasLayer = createClusterLayer('cluster-iglesias');
    var mercadosLayer = createClusterLayer('cluster-mercados');
    var hospitalesLayer = L.layerGroup(); 

    map.removeLayer(colegiosLayer);
    map.removeLayer(iglesiasLayer);
    map.removeLayer(mercadosLayer);
    hospitalesLayer.addTo(map);

    document.getElementById('show-colegios').addEventListener('change', function() {
      if (this.checked) map.addLayer(colegiosLayer); else map.removeLayer(colegiosLayer);
    });
    document.getElementById('show-iglesias').addEventListener('change', function() {
      if (this.checked) map.addLayer(iglesiasLayer); else map.removeLayer(iglesiasLayer);
    });
    document.getElementById('show-mercados').addEventListener('change', function() {
      if (this.checked) map.addLayer(mercadosLayer); else map.removeLayer(mercadosLayer);
    });
    document.getElementById('show-hospitales').addEventListener('change', function() {
      if (this.checked) map.addLayer(hospitalesLayer); else map.removeLayer(hospitalesLayer);
    });

    // MARCADORES MANUALES DE HOSPITALES
    const hospitalesData = [
      { name: "Instituto Nacional de Ciencias Neurológicas", lat: -12.04610212959167, lon: -77.01607161787005 },
      { name: "Instituto Nacional Materno Perinatal", lat: -12.05228067526418, lon: -77.02206919114937 },
      { name: "Hospital Nacional 2 de Mayo", lat: -12.056569001304512, lon: -77.01604887277527 },
      { name: "Hospital Nacional Arzobispo Loayza", lat: -12.049579411632719, lon: -77.04265725748083 }
    ];

    hospitalesData.forEach(hosp => {
      L.marker([hosp.lat, hosp.lon], { icon: hospitalIcon })
       .bindPopup(`<b>${hosp.name}</b><br><a href="https://www.google.com/maps/dir/?api=1&origin=My+Location&destination=${hosp.lat},${hosp.lon}" target="_blank">Cómo llegar</a>`)
       .addTo(hospitalesLayer);
    });

    // ==========================================
    // 5. ICONOS DINÁMICOS Y LEYENDA HORIZONTAL
    // ==========================================
 function obtenerIconoBase(nombreEess) {
      const clave = normalizarClaveEess(nombreEess);
      if (clave === "C.S.M.C MENTAL MIRONES BAJOS" || clave === "C.S.M.C MENTAL SAN MARCOS") {
        return `<img src="iconos/mentales.png" style="width: 40px; height: 40px; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3));">`;
      } else if (clave === "C.E. ANTIRABICO ZOONOSIS") {
        return `<img src="iconos/huellas10.png" style="width: 40px; height: 40px; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3));">`;
      } else if (clave === "C.S. PATRUCO") {
        return `<img src="iconos/hiv.png" style="width: 40px; height: 40px; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3));">`;
      } else if (clave === "COMEDOR CENTRO DE ALIMENTACION Y NUTRICION N°1") {
        // NUEVA LÍNEA PARA EL COMEDOR
        return `<img src="iconos/comedor_popular.jpg" style="width: 40px; height: 45px; border-radius: 50%; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3));">`;
      }
      return `<img src="iconos/centros.png" style="width: 40px; height: 40px; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3));">`;
    }


    // FUNCIÓN DE LEYENDA HORIZONTAL CON SECCIÓN "COMEDORES"
    function actualizarLeyenda() {
      const contenedorLeyenda = document.getElementById('leyenda-contenido');
      if (!contenedorLeyenda) return;

      // Agrupación de centros en 4 categorías
      const mentales = ["C.S.M.C MENTAL MIRONES BAJOS", "C.S.M.C MENTAL SAN MARCOS"];
      const especializados = ["C.S. PATRUCO", "C.E. ANTIRABICO ZOONOSIS"];
      const comedores = ["COMEDOR CENTRO DE ALIMENTACION Y NUTRICION N°1"];
      const centrosSalud = Object.keys(coloresPoligonos).filter(
        k => !mentales.includes(k) && !especializados.includes(k) && !comedores.includes(k)
      );

      // Ordenar por números (1 al 16)
      centrosSalud.sort((a, b) => (eessNumeros[a] || 999) - (eessNumeros[b] || 999));
      mentales.sort((a, b) => (eessNumeros[a] || 999) - (eessNumeros[b] || 999));
      especializados.sort((a, b) => (eessNumeros[a] || 999) - (eessNumeros[b] || 999));
      comedores.sort((a, b) => (eessNumeros[a] || 999) - (eessNumeros[b] || 999));

      function buildGroup(title, keys, flexProportion, minColWidth) {
        if (keys.length === 0) return '';
        
        let html = `<div style="flex: ${flexProportion}; min-width: 200px;">
                      <h5 style="margin: 0 0 8px 0; font-size: 11px; color: #1e293b; font-weight: bold; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; text-transform: uppercase;">${title}</h5>
                      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(${minColWidth}, 1fr)); gap: 6px 12px;">`;
        
        for (let i = 0; i < keys.length; i++) {
          let key = keys[i];
          let nombreMostrar = nombresLeyenda[key] || key;
          let num = eessNumeros[key] || "";
          let color = coloresPoligonos[key];
          
          let rutaIcono = 'iconos/centros.png';
          if (mentales.includes(key)) { rutaIcono = 'iconos/mentales.png'; } 
          else if (key === "C.E. ANTIRABICO ZOONOSIS") { rutaIcono = 'iconos/rabia.png'; } 
          else if (key === "C.S. PATRUCO") { rutaIcono = 'iconos/hiv.png'; }
          else if (comedores.includes(key)) { rutaIcono = 'iconos/comedor_popular.jpg'; } // NUEVA LÍNEA
  
          

          // Se permite que el texto largo baje a la siguiente línea (white-space: normal)
          html += `
            <div style="display: flex; align-items: flex-start; justify-content: flex-start; padding: 2px 0;">
              <img src="${rutaIcono}" style="width: 16px; height: 16px; margin-right: 4px; flex-shrink: 0; margin-top: 1px;">
              <span style="background: ${color}; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; margin-right: 6px; border: 1px solid #475569; border-radius: 50%; font-size: 9px; font-weight: bold; color: #000; flex-shrink: 0; margin-top: 1px;">${num}</span> 
              <span style="font-size: 10.5px; color: #0f172a; line-height: 1.25; font-weight: 500; white-space: normal; word-break: break-word;" title="${nombreMostrar}">${nombreMostrar}</span>
            </div>`;
        }
        html += `</div></div>`;
        return html;
      }

      contenedorLeyenda.innerHTML = 
        buildGroup("Centros y Puestos de Salud", centrosSalud, "3.2", "200px") + 
        buildGroup("Centro de Salud Mental Comunitario", mentales, "1", "180px") + 
        buildGroup("Especializados", especializados, "1", "180px") +
        buildGroup("Comedores", comedores, "1.1", "190px");
    }

    // ==========================================
    // 6. CARGAR MARCADORES DE EESS (CSV)
    // ==========================================
    Papa.parse("data_eess.csv", {
      download: true, header: true, delimiter: ";",
      complete: function(results) {
        const data = results.data;
        data.forEach(row => {
          if (row.COORDENADAS && row.RIS && row.EESS) {
            const [lat, lon] = row.COORDENADAS.split(",").map(coord => parseFloat(coord.trim()));

            if (!isNaN(lat) && !isNaN(lon)) {
              const eess = normalizarClaveEess(row.EESS);
              const nombrePopup = nombresLeyenda[eess] || eess;
              const num = eessNumeros[eess] || "";
              const colorFondo = coloresPoligonos[eess] || "#007e9d";
              const iconoDinamico = obtenerIconoBase(eess);

              const combinedIcon = L.divIcon({
                className: 'combined-marker',
                html: `<div style="display: flex; align-items: center; width: max-content;">
                          ${iconoDinamico}
                          <div style="background-color: ${colorFondo}; color: #1f2937; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.4); font-size: 13px; margin-left: -8px; z-index: 10;">${num}</div>
                        </div>`,
                iconSize: [60, 40], iconAnchor: [20, 40], popupAnchor: [0, -40]
              });

              const marker = L.marker([lat, lon], { icon: combinedIcon })
                .bindPopup(`<b>${nombrePopup}</b><br>Dirección: ${row.DIRECCION}<br>${row.DISTRITO}<br><a href="https://www.google.com/maps/dir/?api=1&origin=My+Location&destination=${lat},${lon}" target="_blank">Cómo llegar</a>`)
                .addTo(map); 

              const ris = row.RIS.trim();
              eessMarkers[eess] = { marker, lat, lon };
              if (!risEessMap[ris]) { risEessMap[ris] = []; }
              if (!risEessMap[ris].includes(eess)) {

              }
            }
          }

            const option = document.createElement("option");
            option.value = ris; option.textContent = ris;

        risEessMap[ris].sort((a, b) => (eessNumeros[a] || 999) - (eessNumeros[b] || 999)).forEach(eess => {

    }
    
    function resetDistritoHighlight() {

    }

    function resetHighlightedPolygon() {
      if (currentHighlightedPolygon) {
        const eessKey = normalizarClaveEess(currentHighlightedPolygon.feature.properties.EESS);
        const colorOriginal = coloresPoligonos[eessKey] || "#0096ba";
        currentHighlightedPolygon.setStyle({ weight: 1.5, color: "#000000", fillColor: colorOriginal, fillOpacity: 0.45 });

      }
    }

      risSelect.value = ""; eessSelect.innerHTML = `<option value="">Seleccione EESS</option>`; eessSelect.disabled = true;
      distritoSelect.value = ""; schoolSearchInput.value = ""; schoolSearchResults.innerHTML = ""; schoolSearchResults.classList.remove("active");
      document.getElementById("show-colegios").checked = false; document.getElementById("show-iglesias").checked = false; document.getElementById("show-mercados").checked = false; 
      
      map.removeLayer(colegiosLayer); map.removeLayer(iglesiasLayer); map.removeLayer(mercadosLayer);
      
      resetDistritoHighlight(); resetHighlightedPolygon(); map.closePopup(); map.setView([-12.0464, -77.0428], 13);
    }
    clearFiltersBtn.addEventListener("click", clearAllFilters);

    // CARGAR GEOJSON DE EESS
    fetch("DIRISLC_CENTROS_5.geojson")
      .then(response => response.json())
      .then(geoData => {
        L.geoJSON(geoData, {
          style: feature => {
            const eessKey = normalizarClaveEess(feature.properties.EESS);
            const colorAsignado = coloresPoligonos[eessKey] || "#0096ba";
            
            return { color: "#000000", fillColor: colorAsignado, weight: 1.5, fillOpacity: 0.45 };
          },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              const eessKey = normalizarClaveEess(feature.properties.EESS);
              const colorAsignado = coloresPoligonos[eessKey] || "#0096ba";
              const nombreMostrar = nombresLeyenda[eessKey] || eessKey;
              
              if (eessKey) eessPolygons[eessKey] = layer;

              let routeLink = '';
              if (eessMarkers[eessKey]) {
                const { lat, lon } = eessMarkers[eessKey];
                routeLink = `<br><a href="https://www.google.com/maps/dir/?api=1&origin=My+Location&destination=${lat},${lon}" target="_blank">Cómo llegar</a>`;
              }              
              const content = `<b>EESS:</b> ${nombreMostrar}<br><b>RIS:</b> ${feature.properties.RIS}<br><b>Distrito:</b> ${feature.properties.DISTRITO}<br><b>Ruta:</b> ${routeLink}`;
              
              layer.bindTooltip(content, { permanent: false, direction: "auto", opacity: 0.9 });
              
              layer.on("mouseover", function() { 
                if (layer !== currentHighlightedPolygon) layer.setStyle({ weight: 4, color: "#333333", fillOpacity: 0.7 }); 
              });
              
              layer.on("mouseout", function() { 
                if (layer !== currentHighlightedPolygon) {
                  const currentColor = coloresPoligonos[eessKey] || "#0096ba";
                  layer.setStyle({ weight: 1.5, color: "#000000", fillColor: currentColor, fillOpacity: 0.45 }); 
                }
              });
              
              layer.on("click", function() {
                if (eessKey) {
                  let risFound = "";
                  for (const [ris, eessList] of Object.entries(risEessMap)) {
                    if (eessList.includes(eessKey)) { risFound = ris; break; }
                  }
                  if (risFound) {
                    risSelect.value = risFound; risSelect.dispatchEvent(new Event('change'));
                    setTimeout(() => { eessSelect.value = eessKey; eessSelect.dispatchEvent(new Event('change')); }, 100);
                  }
                }
              });
            }
          }
        }).addTo(map);
      })
      .catch(error => console.error("Error cargando GeoJSON:", error));

    // CARGAR COLEGIOS
    Papa.parse("data_cole.csv", {
      download: true, header: true, delimiter: ";",
      complete: function(results) {
        const schoolsByCoord = {};
        results.data.forEach(row => {
          if (row.COORDENADAS) {
            const coordKey = row.COORDENADAS.trim();
            if (!schoolsByCoord[coordKey]) schoolsByCoord[coordKey] = [];
            schoolsByCoord[coordKey].push(row);
          }
        });
        Object.entries(schoolsByCoord).forEach(([coordKey, schools]) => {
          const [lat, lon] = coordKey.split(",").map(coord => parseFloat(coord.trim()));
          if (!isNaN(lat) && !isNaN(lon)) {
            let popupContent = '';
            schools.forEach((school, index) => {
              if (index > 0) popupContent += '<hr>';
              const linkRuta = `https://www.google.com/maps/dir/?api=1&origin=My+Location&destination=${lat},${lon}`;
              popupContent += `<b>${school.CENTRO_EDUCATIVO}</b><br>Código Modular: <span style="color:blue; font-weight:bold;">${school.C_MODULAR}</span><br>Distrito: ${(school.DISTRITO || '').trim()}<br>Nivel: ${school.NIVEL}<br>Tipo: ${school.TIPO}<br>Dirección: ${school.DIRECCION}<br>Total alumnos: ${school.TOTAL}<br>Ruta: <a href="${linkRuta}" target="_blank">Cómo llegar</a>`;
            });
            const marker = L.marker([lat, lon], { icon: smallIcon }).addTo(colegiosLayer).bindPopup(popupContent);
            schoolMarkers.push(marker);
            const uniqueNames = [...new Set(schools.map(s => (s.CENTRO_EDUCATIVO || '').trim()).filter(Boolean))];
            const uniqueNiveles = [...new Set(schools.map(s => (s.NIVEL || '').trim()).filter(Boolean))];
            const distritoPrincipal = (schools[0].DISTRITO || '').trim();
            const displayName = uniqueNames[0] || 'Institución educativa';
            const groupedItem = { nombre: displayName, distrito: distritoPrincipal, lat, lon, marker, popupHtml: popupContent, searchTerms: uniqueNames.join(' | '), nombresAsociados: uniqueNames, niveles: uniqueNiveles };
            schoolGroupedData.push(groupedItem); schoolIndex.push(groupedItem);
          }
        });
      }
    });
    
    function normalizeText(text) { return (text || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
    function renderSchoolResults(items) {
      schoolSearchResults.innerHTML = "";
      if (!items.length) { schoolSearchResults.classList.remove("active"); return; }
      items.forEach(item => {
        const div = document.createElement("div"); div.className = "school-result-item";
        div.innerHTML = `<div class="school-result-name">${item.nombre}</div><div class="school-result-district">${item.distrito || "Sin distrito"} · ${item.niveles.length} nivel(es)</div>`;
        div.addEventListener("click", function() {
          schoolSearchInput.value = `${item.nombre} - ${item.distrito || "Sin distrito"}`;
          schoolSearchResults.classList.remove("active");
          selectSchoolResult(item);
        });
        schoolSearchResults.appendChild(div);
      });
      schoolSearchResults.classList.add("active");
    }
    function selectSchoolResult(item) {
      risSelect.value = ""; eessSelect.innerHTML = `<option value="">Seleccione EESS</option>`; eessSelect.disabled = true; distritoSelect.value = "";
      resetDistritoHighlight(); resetHighlightedPolygon(); map.setView([item.lat, item.lon], 17); L.popup().setLatLng([item.lat, item.lon]).setContent(item.popupHtml).openOn(map);
    }
    schoolSearchInput.addEventListener("input", function() {
      const term = normalizeText(this.value);
      if (term.length < 2) { schoolSearchResults.innerHTML = ""; schoolSearchResults.classList.remove("active"); return; }
      const matches = schoolIndex.filter(item => {
          const nombre = normalizeText(item.nombre); const distrito = normalizeText(item.distrito); const asociados = normalizeText(item.searchTerms);
          return nombre.includes(term) || distrito.includes(term) || asociados.includes(term);
        }).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')).slice(0, 12);
      renderSchoolResults(matches);
    });
    document.addEventListener("click", function(e) { if (!schoolSearchInput.contains(e.target) && !schoolSearchResults.contains(e.target)) schoolSearchResults.classList.remove("active"); });   
    
    // CARGAR GEOJSON DE DISTRITOS
    var distritosGeoLayer;
    fetch("DIRISLC_DISTRITOS.geojson")

      .then(geoData => {
        distritosGeoLayer = L.geoJSON(geoData, {
          style: { color: "#555555", weight: 1.5, fillOpacity: 0, fillColor: "#cccccc" },

        }).addTo(map);
        Object.keys(distritoPolygons).sort().forEach(dist => {
          if (![...distritoSelect.options].some(opt => opt.value === dist)) {
            const option = document.createElement("option"); option.value = dist; option.textContent = dist; distritoSelect.appendChild(option);
          }
        });
        distritoSelect.addEventListener("change", function() {
          const distSeleccionado = this.value; risSelect.value = ""; eessSelect.innerHTML = `<option value="">Seleccione EESS</option>`; eessSelect.disabled = true; resetHighlightedPolygon();
          distritosGeoLayer.eachLayer(layer => layer.setStyle({ color: "#555555", weight: 1.5, fillOpacity: 0, fillColor: "#cccccc" }));
          if (distSeleccionado && distritoPolygons[distSeleccionado]) {
            distritoPolygons[distSeleccionado].setStyle({ color: "#e63946", weight: 3, fillOpacity: 0.25, fillColor: "#e63946" });
            map.fitBounds(distritoPolygons[distSeleccionado].getBounds(), { padding: [20, 20] });
          }
        });
      }).catch(error => console.error("Error cargando GeoJSON de distritos:", error));

        btn.disabled = true;
        btn.style.opacity = '0.7';

        htmlToImage.toPng(mapElement, {
          quality: 1.0,
          pixelRatio: 2,
          filter: function (node) {
            return !node.classList || !node.classList.contains('leaflet-control-zoom');
          }
        })
        .then(function (dataUrl) {
          const link = document.createElement('a');
          link.download = 'mapa_jurisdiccion_ris1.png';
          link.href = dataUrl;
          link.click();

          btn.textContent = 'Descargar Mapa (Ultra HD)';
          btn.disabled = false;
          btn.style.opacity = '1';
        })
        .catch(function (error) {
          console.error('Error al generar la captura:', error);
          alert('Ocurrió un error al capturar el mapa. Asegúrate de que el servidor permita exportar las imágenes (CORS).');
          btn.textContent = 'Descargar Mapa (Ultra HD)';
          btn.disabled = false;
          btn.style.opacity = '1';
        });
      });
    }
  </script>
</body>
</html>
